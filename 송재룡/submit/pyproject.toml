[project]
name = "market-agent"
version = "0.1.0"
description = "Korean-market intelligence agent MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.4",
    "finance-datareader>=0.9.94",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.2.1",
]

[project.scripts]
market-agent = "market_agent.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
