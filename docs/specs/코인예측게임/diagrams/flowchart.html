<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>코인 예측 게임 — 사용자 플로우</title>
<style>
  body { font-family: -apple-system, "Pretendard", "Spoqa Han Sans Neo", sans-serif; background: #fafafa; color: #1a1a1a; margin: 0; padding: 32px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 24px; }
  .canvas { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 24px; }
  svg { width: 100%; height: auto; }
  .lbl { font-size: 13px; fill: #1a1a1a; font-weight: 600; text-anchor: middle; }
  .sub-lbl { font-size: 11px; fill: #666; text-anchor: middle; }
  .step { fill: #fff; stroke: #525252; stroke-width: 1.5; }
  .step-decision { fill: #fff8e1; stroke: #f59e0b; stroke-width: 1.5; }
  .step-end-good { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; }
  .step-end-bad { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; }
  .arrow { stroke: #525252; stroke-width: 1.5; fill: none; }
  .arrow-lbl { font-size: 11px; fill: #525252; }
</style>
</head>
<body>
<h1>코인 예측 게임 — 사용자 플로우</h1>
<div class="sub">민수의 24h 사이클: 진입 → 인사이트 학습 → 예측 → 결과 → 거래 전환</div>
<div class="canvas">
<svg viewBox="0 0 1200 700">
  <!-- Start -->
  <ellipse cx="100" cy="60" rx="60" ry="22" class="step"/>
  <text x="100" y="65" class="lbl">앱 진입</text>

  <!-- Predict main -->
  <rect x="220" y="38" width="160" height="44" rx="8" class="step"/>
  <text x="300" y="58" class="lbl">예측 메인 (S-01)</text>
  <text x="300" y="75" class="sub-lbl">8채널 카드 그리드</text>

  <!-- Decision: card click? -->
  <polygon points="490,60 560,28 630,60 560,92" class="step-decision"/>
  <text x="560" y="58" class="lbl">카드 탭?</text>

  <!-- Card detail -->
  <rect x="700" y="20" width="160" height="44" rx="8" class="step"/>
  <text x="780" y="40" class="lbl">카드 상세 (S-02)</text>
  <text x="780" y="56" class="sub-lbl">차트 / 코멘트 / 출처</text>

  <!-- Decision: predict? -->
  <polygon points="490,170 560,138 630,170 560,202" class="step-decision"/>
  <text x="560" y="168" class="lbl">↑/↓ 탭?</text>

  <!-- Confirm dialog -->
  <rect x="700" y="148" width="160" height="44" rx="8" class="step"/>
  <text x="780" y="168" class="lbl">확인 다이얼로그</text>
  <text x="780" y="184" class="sub-lbl">"마감 시각, 취소 불가"</text>

  <!-- Predict locked -->
  <rect x="940" y="148" width="160" height="44" rx="8" class="step"/>
  <text x="1020" y="168" class="lbl">예측 잠금</text>
  <text x="1020" y="184" class="sub-lbl">토스트 + 잠금 상태</text>

  <!-- Wait 24h -->
  <rect x="940" y="240" width="160" height="44" rx="8" class="step"/>
  <text x="1020" y="260" class="lbl">24h 대기</text>
  <text x="1020" y="276" class="sub-lbl">앱 다른 사용 / 카드 탐색</text>

  <!-- Closing settlement -->
  <rect x="940" y="332" width="160" height="44" rx="8" class="step"/>
  <text x="1020" y="352" class="lbl">결산 + 푸시</text>
  <text x="1020" y="368" class="sub-lbl">FR-010</text>

  <!-- Decision: hit? -->
  <polygon points="950,440 1020,408 1090,440 1020,472" class="step-decision"/>
  <text x="1020" y="438" class="lbl">적중?</text>

  <!-- Hit branch -->
  <rect x="700" y="490" width="180" height="44" rx="8" class="step"/>
  <text x="790" y="510" class="lbl">결과: 🎯 적중 (S-03)</text>
  <text x="790" y="526" class="sub-lbl">티어 ▲ / 누적 적중률 ▲</text>

  <rect x="450" y="490" width="180" height="44" rx="8" class="step-end-good"/>
  <text x="540" y="510" class="lbl">매도 CTA → 거래</text>
  <text x="540" y="526" class="sub-lbl">FR-011</text>

  <!-- Miss branch -->
  <rect x="700" y="570" width="180" height="44" rx="8" class="step"/>
  <text x="790" y="590" class="lbl">결과: 미적중 (S-03)</text>
  <text x="790" y="606" class="sub-lbl">"내가 놓친 시그널"</text>

  <rect x="450" y="570" width="180" height="44" rx="8" class="step"/>
  <text x="540" y="590" class="lbl">채널 정답 비교 (S-04)</text>
  <text x="540" y="606" class="sub-lbl">정답 채널 강조</text>

  <rect x="220" y="570" width="180" height="44" rx="8" class="step-end-good"/>
  <text x="310" y="590" class="lbl">학습 → 다음 예측</text>
  <text x="310" y="606" class="sub-lbl">+ 매수/매도 진입 가능</text>

  <!-- Arrows -->
  <path d="M 160 60 L 220 60" class="arrow" marker-end="url(#a)"/>
  <path d="M 380 60 L 490 60" class="arrow" marker-end="url(#a)"/>
  <path d="M 630 60 Q 670 60 700 42" class="arrow" marker-end="url(#a)"/>
  <text x="650" y="50" class="arrow-lbl">예 (탐색)</text>
  <path d="M 780 64 Q 780 110 560 138" class="arrow" marker-end="url(#a)"/>
  <text x="700" y="115" class="arrow-lbl">상세 보고 닫기</text>
  <path d="M 560 92 L 560 138" class="arrow" marker-end="url(#a)"/>
  <text x="568" y="118" class="arrow-lbl">아니오 (바로 예측)</text>

  <path d="M 630 170 L 700 170" class="arrow" marker-end="url(#a)"/>
  <text x="660" y="160" class="arrow-lbl">예</text>
  <path d="M 860 170 L 940 170" class="arrow" marker-end="url(#a)"/>
  <text x="895" y="160" class="arrow-lbl">확인</text>
  <path d="M 1020 192 L 1020 240" class="arrow" marker-end="url(#a)"/>
  <path d="M 1020 284 L 1020 332" class="arrow" marker-end="url(#a)"/>
  <path d="M 1020 376 L 1020 408" class="arrow" marker-end="url(#a)"/>

  <path d="M 990 458 Q 950 480 880 512" class="arrow" marker-end="url(#a)"/>
  <text x="930" y="500" class="arrow-lbl">예</text>
  <path d="M 1050 458 Q 1080 480 880 590" class="arrow" marker-end="url(#a)"/>
  <text x="1100" y="540" class="arrow-lbl">아니오</text>

  <path d="M 700 512 L 630 512" class="arrow" marker-end="url(#a)"/>
  <path d="M 700 590 L 630 590" class="arrow" marker-end="url(#a)"/>
  <path d="M 450 590 L 400 590" class="arrow" marker-end="url(#a)"/>

  <!-- Loop back from learning -->
  <path d="M 220 590 Q 100 590 100 80" class="arrow" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="80" y="350" class="arrow-lbl" transform="rotate(-90, 80, 350)">다음날 24h 사이클</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>
</svg>
</div>
</body>
</html>
